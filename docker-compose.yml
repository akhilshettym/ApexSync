services:
  # The PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: apexsync_postgres
    environment:
      POSTGRES_USER: apexsync_admin
      POSTGRES_PASSWORD: apexsync_password
      POSTGRES_DB: apexsync_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # The Redis Cache
  redis:
    image: redis:7-alpine
    container_name: apexsync_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: