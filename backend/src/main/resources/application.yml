spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/apexsync_db
    username: apexsync_admin
    password: apexsync_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Automatically map entity classes to DB tables during development
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  tomcat:
    threads:
      max: 200